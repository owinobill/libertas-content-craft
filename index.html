        <title>Libertas Africa | Strategic Financial Advisory & NPL Solutions</title>
        <meta name="description" content="Strategic consulting and advisory solutions in the financial sector - NPL portfolio sales, investment advisory, project finance, and policy & regulatory advisory across Africa." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Libertas Africa" />
    <link rel="apple-touch-icon" href="/lovable-uploads/6eeb5f85-9110-4fdb-bd6d-a88591d80ddd.png" />
  </head>

  <body>
    <!-- Immediate FCP content - renders before React loads -->
    <div id="fcp-skeleton" style="
      min-height: 100vh;
      background: linear-gradient(135deg, hsl(220, 30%, 6%) 0%, hsl(195, 25%, 15%) 40%, hsl(162, 45%, 20%) 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: hsl(210, 40%, 95%);
    ">
      <!-- Header skeleton -->
      <header style="
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(14, 16, 26, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      ">
        <nav style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 1rem 1.5rem;
          max-width: 1200px;
          margin: 0 auto;
          height: 4rem;
        ">
          <div style="height: 3rem; width: 120px; background: rgba(255,255,255,0.1); border-radius: 8px;"></div>
          <div style="display: flex; gap: 2rem;">
            <div style="width: 60px; height: 20px; background: rgba(255,255,255,0.1); border-radius: 4px;"></div>
            <div style="width: 60px; height: 20px; background: rgba(255,255,255,0.1); border-radius: 4px;"></div>
            <div style="width: 80px; height: 20px; background: rgba(255,255,255,0.1); border-radius: 4px;"></div>
            <div style="width: 90px; height: 20px; background: rgba(255,255,255,0.1); border-radius: 4px;"></div>
          </div>
        </nav>
      </header>
      
      <!-- Hero skeleton -->
      <section style="
        position: relative;
        min-height: calc(100vh - 6rem);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
      ">
        <div style="max-width: 80rem; margin: 0 auto;">
          <!-- Main headline skeleton -->
          <div style="margin-bottom: 2rem;">
            <div style="height: 4rem; width: 80%; background: rgba(255,255,255,0.15); border-radius: 8px; margin: 0 auto 1rem;"></div>
            <div style="height: 4rem; width: 60%; background: rgba(255,255,255,0.15); border-radius: 8px; margin: 0 auto;"></div>
          </div>
          
          <!-- Subtitle skeleton -->
          <div style="margin-bottom: 3rem;">
            <div style="height: 1.5rem; width: 90%; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 0 auto 0.5rem;"></div>
            <div style="height: 1.5rem; width: 85%; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 0 auto 0.5rem;"></div>
            <div style="height: 1.5rem; width: 75%; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 0 auto;"></div>
          </div>
          
          <!-- Button skeletons -->
          <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center;">
            <div style="width: 160px; height: 48px; background: hsl(142, 76%, 45%); border-radius: 9999px;"></div>
            <div style="width: 180px; height: 48px; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 9999px;"></div>
          </div>
        </div>
      </section>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide skeleton once React loads
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          const skeleton = document.getElementById('fcp-skeleton');
          const root = document.getElementById('root');
          if (root && root.children.length > 0 && skeleton) {
            skeleton.style.display = 'none';
          }
        }, 100);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
